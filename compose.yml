services:
  postgres:
    image: postgres:17-alpine
    container_name: mynest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mynest
      POSTGRES_PASSWORD: mynest_dev
      POSTGRES_DB: mynest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: mynest-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: saas_mailpit
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
volumes:
  postgres_data:
  redis_data:
